<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <alias binding="strong">
        <family>Symbols Nerd Font Mono</family>
        <prefer>
            <family>Symbols Nerd Font Mono</family>
            <family>IosevkaTerm Nerd Font</family>
            <family>FiraCode Nerd Font Mono</family>
            <family>UbuntuSansMono Nerd Font Mono</family>
            <family>Terminess Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <alias binding="strong">
        <family>IosevkaTerm Nerd Font</family>
        <prefer>
            <family>IosevkaTerm Nerd Font</family>
            <family>FiraCode Nerd Font Mono</family>
            <family>UbuntuSansMono Nerd Font Mono</family>
            <family>Terminess Nerd Font Mono</family>
            <family>Noto Sans SC</family>
            <family>Noto Sans JP</family>
            <family>Symbols Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>
<!-- 
    <alias>
        <family>IosevkaTerm Nerd Font</family>
        <prefer>
            <family>IosevkaTerm Nerd Font</family>
            <family>Symbols Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>
-->

    <!-- Emoji fallback — Symbols first to preserve panel icons -->
    <alias binding="strong">
        <family>sans-serif</family>
        <prefer>
            <family>Inter</family>
            <family>Noto Sans SC</family>
            <family>Noto Sans JP</family>
            <family>Noto Sans KR</family>
            <family>Noto Sans TC</family>
            <family>Symbols Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>
<!-- 
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Symbols Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>
-->

    <alias binding="strong">
        <family>serif</family>
        <prefer>
            <family>IBM Plex Serif</family>
            <family>Noto Serif SC</family>
            <family>Noto Serif JP</family>
            <family>Noto Serif KR</family>
            <family>Noto Serif TC</family>
            <family>Symbols Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <!-- 

    <alias>
        <family>serif</family>
        <prefer>
            <family>Symbols Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>
    -->


    <alias binding="strong">
        <family>monospace</family>
        <prefer>
            <family>FiraCode Nerd Font Mono</family>
            <family>UbuntuSansMono Nerd Font Mono</family>
            <family>Symbols Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

     <!-- 

    <alias>
        <family>monospace</family>
        <prefer>
            <family>Symbols Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
         </alias>
     -->
</fontconfig>

