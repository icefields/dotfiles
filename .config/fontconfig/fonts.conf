<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <alias binding="strong">
        <family>Symbols Nerd Font Mono</family>
        <prefer>
            <family>Symbols Nerd Font Mono</family>
            <family>IosevkaTerm Nerd Font</family>
            <family>FiraCode Nerd Font Mono</family>
            <family>UbuntuSansMono Nerd Font Mono</family>
            <family>Terminess Nerd Font Mono</family>
        </prefer>
    </alias>
  
    <alias>
        <family>IosevkaTerm Nerd Font</family>
        <prefer>
            <family>IosevkaTerm Nerd Font</family>
            <family>Symbols Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <!-- Emoji fallback — Symbols first to preserve panel icons -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Symbols Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <alias>
        <family>serif</family>
        <prefer>
            <family>Symbols Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <alias>
        <family>monospace</family>
        <prefer>
            <family>Symbols Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>
</fontconfig>

