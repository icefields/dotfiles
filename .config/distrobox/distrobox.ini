# =====================================================================
# distrobox.ini - manifest consumed by `distrobox assemble`
#
# create all:
#     distrobox assemble create --file distrobox.ini
# preview the generated commands, nothing is executed:
#     distrobox assemble create --file distrobox.ini --dry-run
# (RECOMMENDED) one entry only:
#     distrobox assemble create --file distrobox.ini -n android-dev
# destroy and rebuild every entry below:
#     distrobox assemble create --file distrobox.ini --replace
# destroy every entry below:
#     distrobox assemble rm --file distrobox.ini
#
# format facts:
#   * [section] IS the container name, keys map 1:1 to create flags
#   * list keys (additional_packages, additional_flags, volume,
#     init_hooks) take space-separated values and stack across lines
#   * an existing box is skipped unless --replace or replace=true on
#     its entry; NOTE: replace=true also leaks onto every entry listed
#     AFTER it, keep such entries at the bottom of the file
#   * ./distrobox.ini in the cwd is picked up without --file
#
# operational fact: package names are NOT resolved by assemble. They
# install at the FIRST `distrobox enter` after creation, in ONE
# all-or-nothing pacman/apt transaction; --dry-run validates nothing
# about package names, so verify names before a --replace.
#
# docs: https://distrobox.it/usage/distrobox-assemble/
# =====================================================================

[android-dev]
image=quay.io/toolbx/arch-toolbox:latest
home=/mnt/lucie/distrobox-home/android-dev
additional_packages="git curl fish neovim android-tools qemu-base"
additional_flags="--device=/dev/dri/renderD128"
additional_flags="--device=/dev/kvm"
additional_flags="--group-add=kvm"
pull=true
replace=true
# distrobox create -i   quay.io/toolbx/arch-toolbox:latest  -n android-dev --home /mnt/lucie/distrobox-home/android-dev --additional-packages "git curl fish neovim adb qemu-headless" y--additional-flags '--device=/dev/dri/renderD128 --device=/dev/kvm --group-add=kvm'

[isol-arch]
image=quay.io/toolbx/arch-toolbox:latest
home=/mnt/lucie/distrobox-home/arch
additional_packages="git curl fish neovim lua luarocks bat qt5ct qt6ct eza rsync freetype2 fontconfig gtk3"
# GL/Vulkan diagnostics; mesa, vulkan-intel, vulkan-radeon already come from distrobox-init
additional_packages="mesa-utils"
# audio: client libs against the host's pipewire sockets, no servers in the box
additional_packages="libpulse libpipewire alsa-utils alsa-plugins pamixer"
# gstreamer core + codecs (gst-libav drags in ffmpeg + CLI)
additional_packages="gst-plugins-base gst-plugins-good gst-libav"
additional_packages="base-devel"
additional_packages="tigervnc luakit gnumeric"
pull=true
replace=true
# softlinks: Downloads scripts .config/fish .config/luakit .local/share/fonts .local/share/icons 
# distrobox create -i   quay.io/toolbx/arch-toolbox:latest -n isol-arch --home /mnt/lucie/distrobox-home/arch --additional-packages "git curl fish neovim"

[ubuntu]
image=quay.io/toolbx/ubuntu-toolbox:latest
home=/mnt/lucie/distrobox-home/ubuntu
additional_packages="git curl wget neovim"
pull=true
replace=true
# distrobox create -i   quay.io/toolbx/ubuntu-toolbox:latest  -n ubuntu --home /mnt/distrobox-home/ubuntu --additional-packages "git curl wget neovim"

[music-arch]
image="quay.io/toolbx/arch-toolbox:latest"
home="/mnt/lucie/distrobox-home/music"
additional_packages="picard pipewire pipewire-pulse pipewire-alsa libpulse git curl fish neovim lua luarocks bat qt5ct qt6ct eza "
pre_init_hooks="export SHELL=/usr/bin/fish;"
# mnt volumes are already mounted by default
pull=true
replace=false

[aider-box]
image=quay.io/toolbx/arch-toolbox:latest
home="/mnt/lucie/distrobox-home/aider"
additional_packages="python python-pipx python-pip python-pytest ruff git openssh curl fish neovim ripgrep lua luarocks eza rsync bat"
init_hooks="curl -LsSf https://aider.chat/install.sh | sh"
pull=true
root=false
replace=true

